<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Mart - Đăng nhập & Đăng ký</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body style="background: #B2EBF2; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;">

    <div style="background: #ffffff; padding: 35px 25px; border-radius: 20px; border: 4px solid #000000; box-shadow: 8px 8px 0px #000000; width: 100%; max-width: 420px; box-sizing: border-box;">

        <div style="display: flex; width: 100%; border: 3px solid #000; border-radius: 10px; overflow: hidden; margin-bottom: 25px; box-shadow: 3px 3px 0px #000;">
            <button id="tab-login" style="flex: 1; padding: 12px; font-weight: 900; border: none; cursor: pointer; background: #00FF99; text-transform: uppercase;" onclick="switchTab('login')">Đăng Nhập</button>
            <button id="tab-register" style="flex: 1; padding: 12px; font-weight: 900; border: none; border-left: 3px solid #000; cursor: pointer; background: #ffffff; text-transform: uppercase;" onclick="switchTab('register')">Đăng Ký</button>
        </div>





        <form id="form-login" onsubmit="submitLogin(event)">
            <h2 style="text-align: center; margin-top: 0; font-weight: 900; text-transform: uppercase; margin-bottom: 20px;"><i class="fas fa-user-shield"></i> Thành viên SOL</h2>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-weight: 800; display: block; margin-bottom: 6px;">Tên tài khoản</label>
                <input type="text" id="login-user" required placeholder="Nhập tài khoản..." style="width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #000; border-radius: 8px; text-align: center; font-weight: bold;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-weight: 800; display: block; margin-bottom: 6px;">Mật khẩu</label>
                <input type="password" id="login-pass" required placeholder="••••••••" style="width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #000; border-radius: 8px; text-align: center; font-weight: bold;">
            </div>

            <button class="btn-submit-contact" type="submit" style="background: #00FF99;">VÀO CỬA HÀNG NGAY</button>
        </form>






        <form id="form-register" onsubmit="submitRegister(event)" style="display: none;">
            <h2 style="text-align: center; margin-top: 0; font-weight: 900; text-transform: uppercase; margin-bottom: 20px;"><i class="fas fa-user-plus"></i> Tạo tài khoản mới</h2>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-weight: 800; display: block; margin-bottom: 6px;">Tên đăng nhập mới</label>
                <input type="text" id="reg-user" required placeholder="Ví dụ: trungmax" style="width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #000; border-radius: 8px; text-align: center; font-weight: bold;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-weight: 800; display: block; margin-bottom: 6px;">Thiết lập mật khẩu</label>
                <input type="password" id="reg-pass" required placeholder="••••••••" style="width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #000; border-radius: 8px; text-align: center; font-weight: bold;">
            </div>

            <button class="btn-submit-contact" type="submit" style="background: #FF8080;">KÍCH HOẠT TÀI KHOẢN</button>
        </form>




        <a href="HTML SOL WEB.html" style="display: block; text-align: center; margin-top: 20px; color: #000; font-weight: bold; text-decoration: underline; font-size: 14px;">❮ Quay về xem sản phẩm</a>
    </div>





    <script>
        // Chuyển đổi tab qua lại giữa Đăng nhập & Đăng ký
        function switchTab(mode) {
            const fLogin = document.getElementById('form-login');
            const fRegister = document.getElementById('form-register');
            const tLogin = document.getElementById('tab-login');
            const tRegister = document.getElementById('tab-register');

            if (mode === 'login') {
                fLogin.style.display = 'block'; fRegister.style.display = 'none';
                tLogin.style.background = '#00FF99'; tRegister.style.background = '#ffffff';
            } else {
                fLogin.style.display = 'none'; fRegister.style.display = 'block';
                tLogin.style.background = '#ffffff'; tRegister.style.background = '#FF8080';
            }
        }

        // ĐĂNG KÝ: Khởi tạo cấu trúc dữ liệu gồm: thông tin cá nhân + giỏ hàng rỗng + đơn hàng rỗng
        function submitRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-user').value.trim();
            const password = document.getElementById('reg-pass').value;

            // Đọc danh sách các tài khoản đang có trên hệ thống trình duyệt
            let accounts = JSON.parse(localStorage.getItem('sol_accounts')) || {};

            if (accounts[username]) {
                alert('Tài khoản này đã tồn tại trên hệ thống SOL! Hãy chọn tên khác nhé.');
                return;
            }

            // Tiến hành đóng gói mô-đun dữ liệu riêng biệt cho tài khoản này
            accounts[username] = {
                password: password,
                cart: [],       // Mảng chứa giỏ hàng độc lập
                orders: []      // Mảng chứa đơn hàng độc lập
            };

            localStorage.setItem('sol_accounts', JSON.stringify(accounts));
            alert('Đăng ký tài khoản SOL thành công!');
            switchTab('login');
        }

        // ĐĂNG NHẬP: Kiểm tra mật khẩu và đồng bộ giỏ hàng cá nhân lên hệ thống chính
        function submitLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value;

            let accounts = JSON.parse(localStorage.getItem('sol_accounts')) || {};

            if (!accounts[username] || accounts[username].password !== password) {
                alert('Tên đăng nhập hoặc mật khẩu của bạn chưa đúng!');
                return;
            }

            // Đăng nhập thành công -> Đánh dấu phiên làm việc hiện tại
            localStorage.setItem('sol_currentUser', username);

            // Đẩy mảng giỏ hàng riêng biệt của tài khoản này ra biến runtime chính
            localStorage.setItem('sol_currentCart', JSON.stringify(accounts[username].cart || []));

            alert('Chào mừng ' + username + ' đã quay trở lại với SOL Mart!');
            window.location.href = 'HTML SOL WEB.html'; // Chuyển hướng về trang chủ
        }
    </script>
</body>
</html>
